# Rendered to /etc/nginx/conf.d/default.conf at container start.
# Uses lazy DNS (resolver + $variable in proxy_pass) so the container
# survives Prosody/JVB cold-start in Kubernetes.

map $arg_vnode $prosody_node {
    default prosody;
    v1 v1;
    v2 v2;
    v3 v3;
    v4 v4;
    v5 v5;
    v6 v6;
    v7 v7;
    v8 v8;
}

map $request_uri $loggable_uri {
    ~^(?P<path>[^?]*)\?.*(?:jwt|token)=  "${DOLLAR}{path}?[params_redacted]";
    default $request_uri;
}

map $http_referer $loggable_referer {
    ~^(?P<url>[^?]*)\?.*(?:jwt|token)=  "${DOLLAR}{url}?[params_redacted]";
    default $http_referer;
}

log_format jitsi_log '$remote_addr - $remote_user [$time_local] '
    '"$request_method $loggable_uri $server_protocol" '
    '$status $body_bytes_sent "$loggable_referer" "$http_user_agent"';

server {
    listen ${HTTP_PORT} default_server;
    listen [::]:${HTTP_PORT} default_server;
    server_name _;

    set $config_js_location /config/config.js;
    set $interface_config_js_location /config/interface_config.js;
    set $xmpp_bosh_upstream ${XMPP_BOSH_URL_BASE};
    set $jvb_ws_upstream ${JVB_WS_URL_BASE};

    root /usr/share/jitsi-meet;
    index index.html index.htm;
    error_page 404 /static/404.html;

    access_log /var/log/nginx/access.log jitsi_log;

    ssi on;
    ssi_types application/x-javascript application/javascript;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/x-icon application/octet-stream application/wasm;
    gzip_vary on;
    gzip_proxied no-cache no-store private expired auth;
    gzip_min_length 512;

    location = /config.js {
        alias $config_js_location;
    }

    location = /interface_config.js {
        alias $interface_config_js_location;
    }

    location = /external_api.js {
        alias /usr/share/jitsi-meet/libs/external_api.min.js;
    }

    # Static assets
    location ~ ^/(libs|css|static|images|fonts|lang|sounds|.well-known)/(.*)$ {
        add_header 'Access-Control-Allow-Origin' '*';
        alias /usr/share/jitsi-meet/$1/$2;
        if ($arg_v) {
            expires 1y;
        }
    }

    # BOSH (lazy DNS — survives Prosody not-yet-ready)
    location = /http-bind {
        proxy_pass $xmpp_bosh_upstream/http-bind?prefix=&$args;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }

    # XMPP websocket
    location = /xmpp-websocket {
        proxy_pass $xmpp_bosh_upstream/xmpp-websocket?prefix=&$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        tcp_nodelay on;
    }

    # Colibri (JVB) websocket
    location ~ ^/colibri-ws/(.*)$ {
        proxy_pass $jvb_ws_upstream/colibri-ws/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        tcp_nodelay on;
    }

    # Tenant / subdomain rewrites
    location ~ ^/([^/?&:'"]+)/config.js$ {
        set $subdomain "$1.";
        set $subdir "$1/";
        alias $config_js_location;
    }

    location ~ ^/([^/?&:'"]+)/(pwa-worker.js|manifest.json)$ {
        set $subdomain "$1.";
        set $subdir "$1/";
        rewrite ^/([^/?&:'"]+)/(pwa-worker.js|manifest.json)$ /$2;
    }

    location ~ ^/([^/?&:'"]+)/http-bind {
        set $subdomain "$1.";
        set $subdir "$1/";
        rewrite ^/(.*)$ /http-bind;
    }

    location ~ ^/([^/?&:'"]+)/xmpp-websocket {
        set $subdomain "$1.";
        set $subdir "$1/";
        rewrite ^/(.*)$ /xmpp-websocket;
    }

    # Anything else → room name. Fall back to index.html.
    location ~ ^/([^/?&:'"]+)$ {
        try_files $uri /index.html;
    }

    location ~ ^/([^/?&:'"]+)/(.*)$ {
        set $subdomain "$1.";
        set $subdir "$1/";
        rewrite ^/([^/?&:'"]+)/(.*)$ /$2;
    }
}
