# Rendered to /etc/nginx/nginx.conf at container start.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # wasm + wav mime additions (not in nginx default mime.types pre-1.21)
    types {
        application/wasm     wasm;
        audio/wav            wav;
    }

    server_names_hash_bucket_size 64;

    # DNS resolver for lazy upstream resolution. Filled in from
    # /etc/resolv.conf by /etc/cont-init.d/10-config so we work in
    # both Docker (127.0.0.11) and Kubernetes (cluster DNS).
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;
    resolver_timeout 5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 0;

    include /etc/nginx/conf.d/*.conf;
}
